name: Build offline release

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }}, py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          
      - name: Build release bundles
        run: uv run python -m scripts.release.build_offline

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::dist/ is missing or empty after the build step."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/

  package:
    name: Package offline bundles
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts

      - name: Zip each combo's bundles
        run: |
          mkdir -p build-zips
          for combo_dir in artifacts/*/; do
            combo="$(basename "$combo_dir")"          # e.g. dist-ubuntu-latest-py3.12
            for app_dir in "$combo_dir"*/; do
              app="$(basename "$app_dir")"
              zip_name="${app}-${combo#dist-}-${{ github.run_number }}.zip"
              (cd "$combo_dir" && zip -qr "../../build-zips/${zip_name}" "${app}")
              echo "Packaged ${zip_name}"
            done
          done
          ls -la build-zips

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_number }}
          path: build-zips/*.zip
          retention-days: 1