name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Force bump type (MAJOR, MINOR, PATCH). Leave empty to auto-detect from commits."
        required: false
      prerelease:
        description: "Prerelease type (alpha, beta, rc). Leave empty for a stable release."
        required: false
        type: choice
        options:
          - ""
          - alpha
          - beta
          - rc

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version, tag, and push
        id: cz
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          increment: ${{ inputs.increment }}
          prerelease: ${{ inputs.prerelease }}
          changelog: true
          push: true # commits + tags + pushes straight to master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Build release bundles
        run: uv run python -m scripts.release.build

      - name: Verify build output
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::dist/ is missing or empty after the build step."
            exit 1
          fi

      - name: Zip release bundles
        run: |
          mkdir -p release-zips
          for app_dir in dist/*/; do
            app="$(basename "$app_dir")"
            zip_name="${app}-v${{ steps.cz.outputs.version }}.zip"
            (cd dist && zip -qr "../release-zips/${zip_name}" "${app}")
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: v${{ steps.cz.outputs.version }}
          name: Release v${{ steps.cz.outputs.version }}
          generate_release_notes: true
          draft: ${{ env.ACT == 'true' }}
          files: release-zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}