name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3). Defaults to the contents of VERSION if omitted.'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never abort a release mid-tag-push; let the second run wait

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0  # full history needed for auto-generated release notes

      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="$(cat VERSION)"
          fi

          # strip all surrounding/embedded whitespace (guards against trailing newline in VERSION)
          VERSION_CLEAN="$(printf '%s' "$RAW" | tr -d '[:space:]')"

          if ! printf '%s' "$VERSION_CLEAN" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Resolved version '$VERSION_CLEAN' is not valid semver (expected e.g. 1.2.3)."
            exit 1
          fi

          echo "version=$VERSION_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="v${{ steps.version.outputs.version }}"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git ls-remote --tags "$REMOTE" "$VERSION" | grep -q "$VERSION"; then
            echo "::error::Tag $VERSION already exists. Bump the version in VERSION file or pass a different version input."
            exit 1
          fi

          git tag "$VERSION"
          git push "$REMOTE" "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: ${{ env.ACT == 'true' }}  # act automatically sets ACT=true. https://nektosact.com/usage/index.html?highlight=env.ACT#skipping-steps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
