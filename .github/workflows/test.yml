name: Test

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run pytest
        run: uv run pytest apps/*/tests/unit packages/*/tests/unit
