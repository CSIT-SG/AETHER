repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-zero
        language: system
        types: [python]
        require_serial: true
        verbose: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      
      - id: docs-format
        name: bun format (apps/docs)
        entry: bash -c 'cd apps/docs && bun run format'
        language: system
        pass_filenames: false
        files: ^apps/docs/