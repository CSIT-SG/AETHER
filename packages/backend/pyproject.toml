[project]
name = "aether_backend"
version = "0.0.5"
description = "AETHER backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "fastmcp[tasks]>=4",
    "rpyc==6.0.2",
    "aether_utils",
    "aether_rpc",
    "openai-agents==0.21.0",
    "watchfiles==1.2.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_backend"]
