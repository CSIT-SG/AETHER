# Example rubric for AETHER benchmark
# Save this file and run:
#   aether-benchmark --idb <your.i64> --rubric example_rubric.yaml

benchmark:
  name: "AETHER Annotation Quick Test"
  version: "0.1.0"
  description: "Quick smoke-test of AETHER annotation capabilities"

rubrics:
  - id: "rename_easy"
    feature: "annotation"
    difficulty: "easy"
    description: "Function should be renamed from auto-generated name"
    function_address: "0x14E373"
    weight: 1.0
    criteria:
      - id: "c1"
        description: "Function has been renamed from sub_* to a meaningful name"
      - id: "c2"
        description: "Function has a header comment explaining its purpose"

  - id: "variables_easy"
    feature: "annotation"
    difficulty: "easy"
    description: "Local variables should have meaningful names"
    function_address: "0x1264B0"
    weight: 1.0
    criteria:
      - id: "c1"
        description: "Local variables have been renamed from placeholders (v1, a1, etc.) to meaningful names"
      - id: "c2"
        description: "Function has inline comments explaining key operations"
