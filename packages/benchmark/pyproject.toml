[project]
name = "aether_benchmark"
version = "0.1.0"
description = "AETHER benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "pyyaml>=6.0",
    "openai-agents==0.21.0",
    "openai>=3.0.0,<4",
    "aether_utils",
    "aether_rpc",
    "aether_backend",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
aether-benchmark = "aether_benchmark.__main__:main"

[tool.mypy]
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_benchmark"]
include = [
  "src/aether_benchmark/**/*.md",
]
