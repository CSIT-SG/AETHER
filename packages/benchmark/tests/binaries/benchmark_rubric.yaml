# Rubric for benchmark_test.exe
# Addresses filled in from IDA (unstripped reference build).

benchmark:
  name: "AETHER Test Binary Benchmark"
  version: "1.0.0"
  description: "Rubric for benchmark_test.c — 6 small functions that AETHER should annotate"
  rubrics:
    - id: "xor_encrypt"
      feature: "annotation"
      difficulty: "easy"
      description: "xor_encrypt — XOR encryption of a buffer using a single-byte key"
      function_address: "0x1400014C0"    # xor_encrypt
      weight: 1.0
      criteria:
        - id: "c1"
          description: "Function has a meaningful name (not sub_*) describing its purpose"
        - id: "c2"
          description: "Parameters buffer, len, key have meaningful names"
        - id: "c3"
          description: "Function has a header comment explaining the XOR encryption logic"

    - id: "hex_encode"
      feature: "annotation"
      difficulty: "easy"
      description: "hex_encode — converts binary data to hex string using a lookup table"
      function_address: "0x140001580"    # hex_encode
      weight: 1.0
      criteria:
        - id: "c1"
          description: "Function has a meaningful name (not sub_*) describing its purpose"
        - id: "c2"
          description: "Variables (hex_chars, index variables) have meaningful names"
        - id: "c3"
          description: "The hex_chars lookup table usage is explained via inline comment"

    - id: "compute_crc8"
      feature: "annotation"
      difficulty: "medium"
      description: "compute_crc8 — computes CRC-8 checksum with polynomial 0x07"
      function_address: "0x140001600"    # compute_crc8
      weight: 1.0
      criteria:
        - id: "c1"
          description: "Function has a meaningful name (not sub_*)"
        - id: "c2"
          description: "The CRC polynomial constant is documented"
        - id: "c3"
          description: "Inline comments explain the bit-shifting loop logic"

    - id: "validate_crc8"
      feature: "annotation"
      difficulty: "easy"
      description: "validate_crc8 — compares computed CRC against expected value"
      function_address: "0x140001640"    # validate_crc8
      weight: 1.0
      criteria:
        - id: "c1"
          description: "Function has a meaningful name"
        - id: "c2"
          description: "Return value meaning (valid/invalid) is documented in a comment"

    - id: "str_append"
      feature: "annotation"
      difficulty: "medium"
      description: "str_append — safe string concatenation with bounds checking"
      function_address: "0x140001690"    # str_append
      weight: 1.0
      criteria:
        - id: "c1"
          description: "Function has a meaningful name"
        - id: "c2"
          description: "Parameter names are meaningful (dst, dst_cap, src)"
        - id: "c3"
          description: "The bounds check and null-termination logic has inline comments"
        - id: "c4"
          description: "Return value (resulting string length) is documented"

    - id: "str_append_callees"
      feature: "annotation"
      difficulty: "hard"
      description: "str_append — callees (strlen, memcpy) should remain as recognized imports"
      function_address: "0x140001690"    # str_append (callee check)
      weight: 1.0
      criteria:
        - id: "c1"
          description: "Library imports strlen and memcpy are NOT renamed (they should stay as-is)"
        - id: "c2"
          description: "Function has inline comments at each branch (no-room path vs copy path)"
