[project]
name = "aether_core"
version = "0.1.0"
description = "AETHER core library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.34.0",
    "PyQt5>=5.15.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

