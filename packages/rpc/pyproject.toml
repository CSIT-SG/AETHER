[project]
name = "aether_rpc"
version = "0.0.6.dev2"
description = "AETHER RPC library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "idapro==0.0.9",
    "pydantic==2.13.4",
    "rpyc==6.0.2",
    "aether_utils",
    "yara-x>=1.19.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.uv.sources]
aether_test_fixtures = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_rpc"]
