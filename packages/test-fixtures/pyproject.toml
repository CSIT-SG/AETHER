[project]
name = "aether_test_fixtures"
version = "0.1.0"
description = "AETHER test fixtures shared package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []


[project.entry-points."pytest11"]
aether-test-fixtures = "aether_test_fixtures.plugin"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_test_fixtures"]