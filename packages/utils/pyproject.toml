[project]
name = "aether_utils"
version = "0.1.0"
description = "AETHER utilities shared package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "openai==2.41.0",
    "platformdirs==4.10.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_utils"]