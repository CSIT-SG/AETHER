[project]
name = "aether_utils"
version = "0.0.5.dev5"
description = "AETHER utilities shared package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2==2.12.0",
    "pydantic==2.13.4",
    "openai>=3.0.0,<4",
    "platformdirs==4.10.0",
    "openai-agents==0.21.0",
    "commitizen>=4.18.0"
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_utils"]