[project]
name = "aether_utils"
version = "0.1.0"
description = "AETHER utilities shared package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic",
    "openai",
    "platformdirs>=4.10.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
