[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
aether_cli = { workspace = true }
aether_gui = { workspace = true }
aether_utils = { workspace = true }
aether_rpc = { workspace = true }
aether_backend = { workspace = true }
aether_test_fixtures = { workspace = true }

[project]
name = "aether-next"
version = "0.1.0"
description = "AETHER - AI-powered Next Generation Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=6.0.0",
    "watchfiles>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "mypy>=2.1.0",
    "pytest-dependency>=0.6.1",
    "pytest-order>=1.4.0",
    "pre-commit>=4.6.0",
    "pytest-asyncio>=1.4.0",
]

# Dev dependencies are managed at workspace level

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C4",     # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "FIX"
]
ignore = [
    "E501",   # line too long (handled by line-length)
    "B008",   # do not perform function calls in argument defaults
    "ARG002", # unused arg
]

[tool.ruff.lint.isort]
known-first-party = ["aether"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
